[eboback]
enabled = true
max_search_results = 100
media_dir = please_specify_a_media_dir_in_the_config_file
scan_timeout = 1000
scan_flush_threshold = 100
scan_follow_symlinks = false
included_file_extensions =
excluded_file_extensions =
  .cue
  .directory
  .html
  .jpeg
  .jpg
  .log
  .nfo
  .pdf
  .png
  .txt
  .zip


# top-level directories for browsing, as <name> <uri>
directories =
    Albums                  eboback:directory?type=album
    Artists                 eboback:directory?type=artist
    Composers               eboback:directory?type=artist&role=composer
    Genres                  eboback:directory?type=genre
    Performers              eboback:directory?type=artist&role=performer
    Release Years           eboback:directory?type=date&format=%25Y
    Tracks                  eboback:directory?type=track
    Last Week's Updates     eboback:directory?max-age=604800
    Last Month's Updates    eboback:directory?max-age=2592000

# database connection timeout in seconds
timeout = 10

# whether to use the sortname field for ordering artist browse
# results; disabled by default, since this may give confusing results
# if not all artists in the library have proper sortnames
use_artist_sortname = false

# a list of file names to check for when searching for external album
# art; may contain UNIX shell patterns, i.e. "*", "?", etc.
album_art_files = *.jpg, *.jpeg, *.png
alsa_mixer = Master